name: JILI 测试数据采集
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 单节点分批采集；pilot 只跑 1 批 2 款游戏的 1 个小批次
        type: choice
        options: [pilot, bulk]
        default: pilot
      minutes:
        description: 单节点总运行分钟数，最多 50；批时长按剩余时间与剩余批次数切片
        type: number
        default: 5
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: read
  actions: write
# 与旧轮共用同一个互斥组：任何时刻只有一个采集作业运行，不重叠、不取消在途原件。
concurrency:
  group: jili-capture-campaign
  cancel-in-progress: false
jobs:
  capture:
    # 计划、调度、采集、归档都在同一个免费标准 Linux 节点内完成，不再使用 20 节点 matrix。
    if: github.event_name == 'workflow_dispatch' || vars.JL_BULK_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          MINUTES: ${{ inputs.minutes }}
        run: |
          node - <<'JS'
          const fs=require('fs');
          const scheduled=process.env.EVENT==='schedule';
          const pilot=!scheduled && process.env.MODE!=='bulk';
          const minutes=scheduled?45:Number(process.env.MINUTES||5);
          if(!Number.isInteger(minutes)||minutes<1||minutes>50)throw Error('分钟数必须为 1 至 50');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`pilot=${pilot}\nminutes=${minutes}\n`);
          JS
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: 检查目标、分批、并发上限、状态合并与加密协议
        run: |
          node campaign-contract.test.cjs
          node campaign-batch.test.cjs
          node campaign-state.test.cjs
          node campaign-worker.test.cjs
          node campaign-delivery.test.cjs
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: state.enc.json
          key: jili-single-state-${{ github.run_id }}
          restore-keys: jili-single-state-
      - name: 官方免费试玩分批采集（单节点，不经测试服代理）
        id: runner
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JL_ENGINE_KEY: ${{ secrets.JL_ENGINE_KEY }}
          JL_PILOT: ${{ steps.plan.outputs.pilot }}
          JL_MINUTES: ${{ steps.plan.outputs.minutes }}
          JL_PHASE: ${{ vars.JL_PHASE || 'normal' }}
          JL_BATCH_GAMES: ${{ vars.JL_BATCH_GAMES }}
          JL_BATCH_CONCURRENCY: ${{ vars.JL_BATCH_CONCURRENCY }}
        run: node github-runner.cjs
      - name: 核对本批产物与交付清单
        id: scan
        if: steps.runner.outputs.produced == 'true'
        run: |
          node - <<'JS'
          const fs=require('fs');
          const delivery=JSON.parse(fs.readFileSync('output/delivery.json'));
          const lines=[];
          for(let i=0;i<4;i++){
            const item=delivery.delivered[i];
            const file=item?`output/jl-batch-${item.index}.enc.json`:'';
            lines.push(`path${i}=${item&&fs.existsSync(file)?file:''}`,`idx${i}=${item?item.index:''}`,`games${i}=${item?item.gameIds.join(','):''}`);
          }
          lines.push(`batches=${delivery.delivered.length}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,lines.join('\n')+'\n');
          JS
      - name: 上传第 1 批加密原件供接收端离线复验
        id: upload0
        if: steps.scan.outputs.path0 != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jl-capture-${{ github.run_id }}-b${{ steps.scan.outputs.idx0 }}
          path: ${{ steps.scan.outputs.path0 }}
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: 上传第 2 批加密原件供接收端离线复验
        id: upload1
        if: steps.scan.outputs.path1 != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jl-capture-${{ github.run_id }}-b${{ steps.scan.outputs.idx1 }}
          path: ${{ steps.scan.outputs.path1 }}
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: 上传第 3 批加密原件供接收端离线复验
        id: upload2
        if: steps.scan.outputs.path2 != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jl-capture-${{ github.run_id }}-b${{ steps.scan.outputs.idx2 }}
          path: ${{ steps.scan.outputs.path2 }}
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: 上传第 4 批加密原件供接收端离线复验
        id: upload3
        if: steps.scan.outputs.path3 != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jl-capture-${{ github.run_id }}-b${{ steps.scan.outputs.idx3 }}
          path: ${{ steps.scan.outputs.path3 }}
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: 只有连续上传成功才推进检查点
        id: finalize
        if: steps.runner.outputs.produced == 'true'
        env:
          U0: ${{ steps.upload0.outcome }}
          U1: ${{ steps.upload1.outcome }}
          U2: ${{ steps.upload2.outcome }}
          U3: ${{ steps.upload3.outcome }}
        run: node checkpoint-finalize.cjs
      - name: 保存队列游标与逐款状态检查点
        if: steps.finalize.outputs.checkpoint == 'true' && steps.plan.outputs.pilot != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: state.enc.json
          key: jili-single-state-${{ github.run_id }}
